name: Daily Squeeze Scan

# NOTE: The actual daily schedule runs on the user's Oracle VM (cron), which has
# a reliable yfinance path. GitHub-hosted runners are rate-limited by Yahoo, so
# the scheduled run is intentionally NOT enabled here. This workflow is kept for
# manual `workflow_dispatch` use / reference only.
on:
  workflow_dispatch:   # manual run from the Actions tab (uses GitHub runner)

permissions:
  contents: write      # needed to commit daily results back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run screener
        run: python screener.py
      - name: Commit results
        run: |
          git config user.name "squeeze-bot"
          git config user.email "bot@users.noreply.github.com"
          today=$(date +%F)
          git add results/ || true
          git commit -m "daily scan $today" || echo "nothing to commit"
          git push
